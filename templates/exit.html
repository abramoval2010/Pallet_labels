<!-- templates/exit.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход из программы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 30%, #81c784 70%, #a5d6a7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .exit-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a237e;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .message {
            color: #546e7a;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.05em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #ef5350);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(244, 67, 54, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(33, 150, 243, 0.4);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exit-icon">🚪</div>
        <h1>Выход из программы</h1>
        <div class="message">
            Вы уверены, что хотите выйти из программы?<br>
            Все несохраненные данные будут потеряны.
        </div>

        <div class="buttons">
            <a href="/" class="btn btn-secondary">⬅️ Вернуться</a>
            <button onclick="exitProgram()" class="btn btn-danger">✅ Выйти</button>
        </div>
    </div>

    <script>
        function exitProgram() {
            if (confirm('Подтвердите выход из программы')) {
                // Закрываем окно или перенаправляем
                window.close();
                // Если window.close() не работает, перенаправляем на страницу закрытия
                window.location.href = 'about:blank';
            }
        }
    </script>
</body>
</html>
