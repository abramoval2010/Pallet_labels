<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход из программы</title>

    <!-- Общие стили: сброс, body, кнопки, alert'ы, flash, бейджи -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

    <!-- Стили, специфичные только для страницы выхода -->
    <style>
        /* Центрирование карточки на странице */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .exit-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Кнопка «Вернуться» — зелёная, растянутая */
        .btn-primary {
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exit-icon">👋</div>
        <h1>Выход из программы</h1>
        <p>
            Спасибо за использование системы<br>
            формирования палетных этикеток!
        </p>
        <a href="/" class="btn btn-primary">🏠 Вернуться</a>
    </div>
</body>
</html>
