<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 30%, #81c784 70%, #a5d6a7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #1a237e;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #4a6fa5;
            font-size: 1.1em;
        }

        .settings-group {
            margin-bottom: 30px;
        }

        .settings-group label {
            display: block;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .settings-group .description {
            color: #78909c;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .settings-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            background: white;
            transition: border-color 0.3s ease;
        }

        .settings-group select:focus {
            outline: none;
            border-color: #4caf50;
        }

        .settings-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .settings-group input[type="text"]:focus {
            outline: none;
            border-color: #4caf50;
        }

        .current-path {
            background: #f5f5f5;
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 10px;
            color: #1a237e;
            word-break: break-all;
        }

        .current-path .label {
            color: #78909c;
            font-size: 0.85em;
        }

        .current-path .value {
            font-weight: 500;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(33, 150, 243, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #ef5350);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(244, 67, 54, 0.4);
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .success-message {
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .actions {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Настройки</h1>
            <div class="subtitle">Настройка путей сохранения палетных этикеток</div>
        </div>

        {% if request.args.get('saved') %}
        <div class="success-message">
            ✅ Настройки успешно сохранены!
        </div>
        {% endif %}

        <form method="post">
            <div class="settings-group">
                <label>📁 Путь к сохраненным палетным этикеткам</label>
                <div class="description">Выберите папку, в которую будут сохраняться сформированные палетные этикетки</div>

                <select name="save_path" id="save_path">
                    {% for drive in drives %}
                    <option value="{{ drive }}" {% if drive == settings.save_path %}selected{% endif %}>
                        {{ drive }}
                    </option>
                    {% endfor %}
                    <option value="custom">Другой путь...</option>
                </select>

                <div id="custom_path_container" style="display: none; margin-top: 10px;">
                    <input type="text" name="custom_path" id="custom_path" placeholder="Введите полный путь к папке" value="{{ settings.save_path if settings.save_path not in drives else '' }}">
                </div>

                <div class="current-path">
                    <div class="label">Текущий путь сохранения:</div>
                    <div class="value">{{ settings.save_path }}</div>
                </div>
            </div>

            <div class="actions">
                <a href="/" class="btn btn-secondary">⬅️ Назад</a>
                <button type="submit" class="btn btn-primary">💾 Сохранить настройки</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('save_path').addEventListener('change', function() {
            const customContainer = document.getElementById('custom_path_container');
            if (this.value === 'custom') {
                customContainer.style.display = 'block';
            } else {
                customContainer.style.display = 'none';
                document.getElementById('custom_path').value = this.value;
            }
        });
    </script>
</body>
</html>
