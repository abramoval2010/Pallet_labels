<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешно</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #81c784 0%, #a5d6a7 50%, #c8e6c9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .success-icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #2e7d32; margin-bottom: 15px; }
        .info {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .info p { margin: 8px 0; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Этикетки успешно сформированы!</h1>

        <div class="info">
            <p><strong>📋 Номер заказа:</strong> {{ order_number }}</p>
            <p><strong>📦 Количество этикеток:</strong> {{ product_count }}</p>
            <p><strong>📁 Файл сохранен:</strong><br>{{ filepath }}</p>
        </div>

        <p style="color: #666; margin: 15px 0;">
            Файл автоматически открыт в Microsoft Word
        </p>

        <div>
            <a href="/" class="btn btn-primary">🏠 На главную</a>
        </div>
    </div>
</body>
</html>
