<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Этикетки сформированы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 30%, #81c784 70%, #a5d6a7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .success-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a237e;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .message {
            color: #546e7a;
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .message strong {
            color: #1a237e;
        }

        .file-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            word-break: break-all;
        }

        .file-info .label {
            color: #78909c;
            font-size: 0.85em;
        }

        .file-info .value {
            color: #1a237e;
            font-weight: 500;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.05em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(33, 150, 243, 0.4);
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .actions {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">🎉</div>
        <h1>Палетные этикетки сформированы!</h1>

        <div class="message">
            Сформировано <strong>{{ product_count }}</strong> палетных этикеток для заказа <strong>№{{ order_number }}</strong>.<br>
            Файл автоматически открыт в Microsoft Word.
        </div>

        <div class="file-info">
            <div class="label">📁 Файл сохранен по пути:</div>
            <div class="value">{{ filepath }}</div>
        </div>

        <div class="actions">
            <a href="/" class="btn btn-secondary">⬅️ На главную</a>
            <a href="/upload" class="btn btn-primary">📄 Загрузить новый PDF</a>
        </div>
    </div>
</body>
</html>
