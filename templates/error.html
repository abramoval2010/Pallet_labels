<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>

    <!-- Общие стили: сброс, body, кнопки, alert'ы, flash, бейджи -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

    <!-- Стили, специфичные только для страницы ошибки -->
    <style>
        /* Своя палитра — красный градиент */
        body {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #c0392b;
            margin-bottom: 15px;
        }

        .error-message {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        /* Своя кнопка — зелёная, растянутая */
        .btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1>Ошибка</h1>
        <div class="error-message">{{ error }}</div>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
