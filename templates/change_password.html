<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля</title>

    <!-- Общие стили: сброс, body, кнопки, alert'ы, flash, бейджи -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

    <!-- Стили, специфичные только для страницы смены пароля -->
    <style>
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #1a237e;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Кнопка «Сменить пароль» — локальная, т.к. здесь другой цвет
           и она растянута на всю ширину карточки */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #ffa726);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }

        /* Кнопка «На главную» — синяя ссылка во всю ширину */
        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Смена пароля</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>Новый пароль (мин. 6 символов)</label>
                <input type="password" name="new_password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Подтвердите новый пароль</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn">Сменить пароль</button>
        </form>
        <a href="/" class="btn btn-secondary">
            🏠 На главную
        </a>
    </div>
</body>
</html>
